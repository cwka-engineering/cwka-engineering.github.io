name = "cwka-wiki-chatbot"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[kv_namespaces]]
binding = "WIKI_CORPUS"
id = "7b65b0b3e73e4608b0b29a412682c585"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "457771cd577e47778a0e833100429156"

# cwka-rhino-qc, called by the cron below to turn a Box Drive path into a Box file link (its /resolve route).
# A service binding, because Workers on one account cannot call each other by workers.dev address.
[[services]]
binding = "RHINO_QC"
service = "cwka-rhino-qc"

# Every 5 minutes: link local run records (they carry a Box Drive path) to their Box files; see src/lib/box-links.ts.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set via: npx wrangler secret put <NAME>)
# - CHAT_ANTHROPIC_API_KEY        (/api/chat)
# - DIAGNOSTIC_ANTHROPIC_API_KEY  (/api/diagnostic, /api/summarize)
# - DIAGNOSTIC_AUTH_TOKEN
# - PA_AUTH_TOKEN
# - PARTS_MATCH_ANTHROPIC_API_KEY  (/api/parts-match)
# - AIRTABLE_PAT                  (/api/diagnostic-runs; write on the Releases & Requests base)
# - DIAGNOSTIC_CLOUD_AUTH_TOKEN   (/api/diagnostic-runs; server-only credential for cloud runs; same value as on cwka-rhino-qc)

[vars]
# /api/diagnostic-runs: Releases & Requests base, "Rhino Diagnostic Tool" and the synced "People" table
RUNS_BASE_ID = "app2X7JU998GzDUWj"
RUNS_TABLE_ID = "tblrQXzt3PswwORMP"
PEOPLE_TABLE_ID = "tblc21jHmUiCiAOHI"
ALLOWED_ORIGIN = "https://cwka-engineering.github.io"
CLAUDE_MODEL = "claude-haiku-5-5"
MAX_REQUESTS_PER_MINUTE = "20"
PA_CLAUDE_MODEL = "claude-haiku-5-5"
